<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="DAHAB Maison Mariée">
  <defs>
    <linearGradient id="goldFull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f0d088"/>
      <stop offset="50%" stop-color="#d6ab5c"/>
      <stop offset="100%" stop-color="#a07f3f"/>
    </linearGradient>
    <linearGradient id="goldFullLite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f4dca0"/>
      <stop offset="100%" stop-color="#c9a55c"/>
    </linearGradient>
  </defs>

  <!-- ─── Left: Arabic ذهب in white + diamonds + MAISON MARIEE ─── -->
  <text x="430" y="240"
        font-family="'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif"
        font-size="240"
        font-weight="400"
        fill="#ffffff"
        text-anchor="middle"
        direction="rtl">ذهب</text>

  <!-- Diamonds + subtitle -->
  <g fill="#ffffff">
    <polygon points="170,328 180,338 170,348 160,338"/>
    <polygon points="690,328 700,338 690,348 680,338"/>
  </g>
  <text x="430" y="344"
        font-family="'Cinzel', 'Trajan Pro', Georgia, serif"
        font-size="32"
        font-weight="500"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="14">MAISON MARIEE</text>

  <!-- ─── Right: gold emblem (refined monogram) ─── -->
  <g transform="translate(820,40) scale(1.35)">
    <g fill="url(#goldFull)" stroke="url(#goldFull)" stroke-linejoin="round">
      <circle cx="42"  cy="38"  r="5"/>
      <circle cx="80"  cy="22"  r="6"/>
      <circle cx="120" cy="14"  r="6.5"/>
      <circle cx="160" cy="22"  r="6"/>
      <circle cx="198" cy="38"  r="5"/>
      <path d="M 42 44 L 56 80 L 80 28 L 100 78 L 120 20 L 140 78 L 160 28 L 184 80 L 198 44 L 192 92 Q 120 100 48 92 Z" stroke-width="1"/>
      <circle cx="80"  cy="78" r="2.4" fill="#fff" stroke="none" opacity="0.55"/>
      <circle cx="120" cy="78" r="2.4" fill="#fff" stroke="none" opacity="0.55"/>
      <circle cx="160" cy="78" r="2.4" fill="#fff" stroke="none" opacity="0.55"/>
    </g>
    <g fill="none" stroke="url(#goldFull)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 70 116 Q 56 168 80 218 Q 100 250 120 264"/>
      <path d="M 170 116 Q 184 168 160 218 Q 140 250 120 264"/>
      <path d="M 70 116 Q 60 102 50 110" stroke-width="4"/>
      <path d="M 170 116 Q 180 102 190 110" stroke-width="4"/>
    </g>
    <g fill="none" stroke="url(#goldFullLite)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 88 138 Q 88 120 120 120 Q 152 120 152 138 L 152 198 Q 152 230 120 240 Q 88 230 88 198 Z" stroke-width="5.5"/>
      <path d="M 100 198 L 102 158 Q 110 142 120 158 L 120 200" stroke-width="4.6"/>
      <path d="M 140 198 L 138 158 Q 130 142 120 158 L 120 200" stroke-width="4.6"/>
      <path d="M 108 168 L 120 198 L 132 168" stroke-width="4"/>
      <path d="M 105 184 L 135 184" stroke-width="3.2" opacity="0.85"/>
      <polygon points="120,132 126,138 120,144 114,138" fill="url(#goldFullLite)" stroke="none"/>
    </g>
  </g>
</svg>
