<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d4c3a"/>
      <stop offset="100%" stop-color="#08362a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c578"/>
      <stop offset="50%" stop-color="#c9a55c"/>
      <stop offset="100%" stop-color="#a07f3f"/>
    </linearGradient>
    <pattern id="khatam" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e6c578" stroke-width="0.6" opacity="0.2">
        <polygon points="40,8 47,30 65,40 47,50 40,72 33,50 15,40 33,30"/>
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#khatam)"/>

  <!-- Big medallion -->
  <g transform="translate(600,315)" opacity="0.18">
    <g fill="none" stroke="#e6c578" stroke-width="1.2">
      <circle r="240" opacity="0.4"/>
      <circle r="220" opacity="0.6"/>
      <polygon points="0,-220 28,-90 200,-50 50,40 130,200 0,90 -130,200 -50,40 -200,-50 -50,-90"/>
      <polygon points="0,-180 50,-50 180,0 50,50 0,180 -50,50 -180,0 -50,-50"/>
      <polygon points="0,-150 35,-30 150,0 35,30 0,150 -35,30 -150,0 -35,-30" transform="rotate(22.5)"/>
      <circle r="10" fill="#e6c578"/>
    </g>
  </g>

  <!-- Logo -->
  <g transform="translate(550,200)">
    <g fill="url(#gold)" stroke="url(#gold)" stroke-width="1.5" stroke-linejoin="round">
      <circle cx="60" cy="42" r="4"/>
      <circle cx="100" cy="32" r="4.5"/>
      <circle cx="140" cy="42" r="4"/>
      <path d="M60 46 L72 58 L80 50 L88 64 L100 38 L112 64 L120 50 L128 58 L140 46 L138 72 L62 72 Z"/>
    </g>
    <g fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round">
      <path d="M62 80 Q55 110 70 145 Q85 170 100 175"/>
      <path d="M138 80 Q145 110 130 145 Q115 170 100 175"/>
      <path d="M80 90 Q80 80 100 80 Q120 80 120 90 L120 130 Q120 150 100 155 Q80 150 80 130 Z" stroke-width="3"/>
      <path d="M88 100 L100 130 L112 100" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="450" font-family="Cormorant Garamond, Georgia, serif" font-size="76" font-weight="300" fill="#fff" text-anchor="middle" font-style="italic">DAHAB</text>
  <text x="600" y="490" font-family="Cormorant Garamond, Georgia, serif" font-size="32" fill="#e6c578" text-anchor="middle" font-style="italic">Maison de la Mariée · Casablanca</text>

  <!-- Tagline -->
  <text x="600" y="555" font-family="Cinzel, serif" font-size="14" fill="#e6c578" text-anchor="middle" letter-spacing="6">L'ART DE LA MARIÉE MAROCAINE · DEPUIS 1962</text>

  <!-- Border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#e6c578" stroke-width="0.5" opacity="0.3"/>
</svg>
